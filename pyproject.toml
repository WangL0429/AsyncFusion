[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AsyncFusion"
version = "0.1.0"
description = "Asynchronous infrared-visible video fusion training"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "numpy==1.26.4",
    "scipy>=1.10,<2",
    "scikit-image>=0.20,<0.25",
    "opencv-python==4.10.0.84",
    "PyYAML>=6,<7",
    "einops>=0.6,<1",
    "natsort>=8,<9",
    "lmdb>=1.4,<2",
    "tensorboard>=2.12,<3",
    "tqdm>=4.65,<5",
    "requests>=2.28,<3",
]

[project.optional-dependencies]
tracking = ["wandb>=0.18"]

[tool.setuptools.packages.find]
include = ["asyncfusion*"]

[tool.setuptools.package-data]
asyncfusion = ["ops/**/*.cpp", "ops/**/*.cu"]
